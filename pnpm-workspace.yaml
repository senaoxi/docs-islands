packages:
  - packages/*
  - packages/*/docs
  - packages/*/playground
  - packages/*/smoke
  - packages/plugins/*
  - packages/**/__tests__/**
  - docs
  - utils
  - '!**/dist'

allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
  nx: true
  playwright-chromium: true

auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99
    - GHSA-4w7w-66w2-5vf9
    - GHSA-fx2h-pf6j-xcff
    - GHSA-v6wh-96g9-6wx3
    - GHSA-h67p-54hq-rp68
    # svelte-v4-min is the exact dev-only Svelte 4.0.0 compatibility floor;
    # the affected runtime and SSR paths are not executed by Limina's tests.
    - GHSA-8266-84wp-wv5c
    - GHSA-crpf-4hrx-3jrp
    - GHSA-m56q-vw4c-c2cp
    - GHSA-f7gr-6p89-r883
    - GHSA-phwv-c562-gvmh
    - GHSA-rcqx-6q8c-2c42
    - GHSA-pr6f-5x2q-rwfp
    # astro-v7-min is the exact dev-only Astro 7.0.0 compatibility floor;
    # tests do not execute the affected runtime or image-optimization paths.
    # astro-v7-current tracks the current Astro 7 stable release and must not rely on these ignores.
    - GHSA-4g3v-8h47-v7g6
    - GHSA-8mv7-9c27-98vc
    - GHSA-f48w-9m4c-m7f5
    - GHSA-7pw4-f3q4-r2p2
