cleanupUnusedCatalogs: true

dedupeInjectedDeps: false

enablePrePostScripts: false

engineStrict: true

failIfNoMatch: true

hoist: false

loglevel: info

managePackageManagerVersions: true

minimumReleaseAge: 1440

nodeVersion: 22.18.0

overrides:
  # Keep Astro's optional image dependency patched in the compatibility fixtures.
  # Limina does not exercise Astro image services, and Astro 7.0.0's declared
  # sharp range remains narrower than this security override.
  'astro@7.0.0>sharp': 0.35.4
  'js-yaml@^4.0.0': 4.3.2
  '@swc/core': 1.15.43
  '@types/node': 22.18.0
  browserslist: 4.28.7
  form-data: 4.0.6
  'gray-matter>js-yaml': 3.15.2
  lodash: 4.18.0
  markdown-it: ^14.2.0
  minimatch@^10.0.0: ^10.2.5
  minimatch@^10.0.0>brace-expansion: 5.0.9
  minimatch@^3.0.0: ^3.1.4
  minimatch@^3.0.0>brace-expansion: 5.0.9
  nx@^23.1.0>brace-expansion: 5.0.9
  picomatch@^2.0.0: 2.3.2
  picomatch@^4.0.0: 4.0.5
  tmp: 0.2.7
  undici: 7.29.0
  undici-types: ^6.24.0
  typescript: ~6.0.3
  shell-quote: 1.10.0
  axios: 1.18.0
  postcss: ^8.5.23
  less: ^4.9.0
  smol-toml: 1.7.1
  '@swc/helpers': 0.5.23

packageExtensions:
  '@pnpm/manifest-utils@*':
    dependencies:
      '@pnpm/logger': 1001.0.1

patchedDependencies:
  '@vueuse/core': patches/@vueuse__core@12.8.2.patch
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  vite@5.4.21: patches/vite@5.4.21.patch
  vitepress: patches/vitepress@1.6.4.patch

patchesDir: patches

publishBranch: main

sharedWorkspaceLockfile: true

shellEmulator: true

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - vite@5.4.21
  - semver
  # @astrojs/check@0.9.10 is an exact dev-only semantic-adapter fixture;
  # its owner-scoped toolchain resolves this exact chokidar release.
  - chokidar@4.0.3

verifyDepsBeforeRun: install
